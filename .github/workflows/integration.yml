name: Integration Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest

    services:
      # Ephemeral PostgreSQL used only for this CI run.
      # Database credentials are intentionally written here, in the YAML
      # itself, so the pipeline does not depend on GitHub secrets for tests.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hy16fxlJj3F1ehx8vWFgQhZ2Z2TNIala55asV6cCSsXF
          POSTGRES_DB: products_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Same credentials as the service container above — kept in this file.
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: hy16fxlJj3F1ehx8vWFgQhZ2Z2TNIala55asV6cCSsXF
      # Dedicated test database, never the development "products" database.
      DATABASE_NAME: products_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run integration tests
        run: bun run test:ci
